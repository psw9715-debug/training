<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>음성 진단</title>
<style>
  :root{ --ink:#1C2B39; --paper:#EFEAE1; --card:#FBF8F2; --red:#C1432E; --green:#3F7D58; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#E8E4DC; --paper:#16191D; --card:#1F2328; } }
  body{ margin:0; padding:16px; background:var(--paper); color:var(--ink); font:15px/1.5 -apple-system, sans-serif; }
  h1{ font-size:18px; margin:0 0 12px; }
  .card{ background:var(--card); border:2px solid var(--ink); border-radius:8px; padding:12px; margin-bottom:12px; }
  button{ display:block; width:100%; min-height:48px; margin:8px 0; font-size:16px; font-weight:600;
          border:2px solid var(--ink); border-radius:8px; background:var(--card); color:var(--ink); }
  button.main{ background:var(--ink); color:var(--card); }
  #log{ font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; max-height:45vh; overflow:auto; }
  .ok{ color:var(--green); } .bad{ color:var(--red); }
  select{ width:100%; min-height:40px; font-size:15px; }
</style>
</head>
<body>
<h1>음성 진단</h1>
<div class="card" id="state">확인 중…</div>
<div class="card">
  <button class="main" id="bDefault">① 기본 음성으로 "테스트입니다" 말하기</button>
  <select id="voiceSel"></select>
  <button id="bPick">② 고른 목소리로 말하기</button>
  <button id="bReset">③ 음성 엔진 초기화 후 다시 말하기</button>
</div>
<div class="card"><b>기록</b> <span style="font-size:12px;">(이 화면을 캡처해서 보내주세요)</span><div id="log"></div></div>
<script>
const logEl = document.getElementById('log');
const t0 = Date.now();
function log(msg, cls){
  const line = document.createElement('div');
  line.textContent = '+' + ((Date.now()-t0)/1000).toFixed(1) + 's  ' + msg;
  if(cls) line.className = cls;
  logEl.prepend(line);
}
const ss = window.speechSynthesis;
function voices(){ try{ return ss ? ss.getVoices() : []; }catch(e){ return []; } }
function renderState(){
  const vs = voices(), ko = vs.filter(v=>/^ko/i.test(v.lang));
  document.getElementById('state').innerHTML =
    'speechSynthesis: ' + (ss ? '<span class="ok">있음</span>' : '<span class="bad">없음</span>') +
    '<br>목소리 전체 ' + vs.length + '개 · 한국어 ' + ko.length + '개' +
    (ko.length ? '<br>한국어: ' + ko.map(v=>v.name + (v.localService ? '' : '(온라인)')).join(', ') : '') +
    (ss ? '<br>상태: speaking=' + ss.speaking + ' · pending=' + ss.pending + ' · paused=' + ss.paused : '');
  const sel = document.getElementById('voiceSel');
  const cur = sel.value;
  sel.innerHTML = ko.map(v=>`<option value="${v.voiceURI}">${v.name}</option>`).join('') || '<option>한국어 목소리 없음</option>';
  if(cur) sel.value = cur;
}
function speak(text, voice){
  if(!ss){ log('speechSynthesis 없음', 'bad'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 1; u.volume = 1;
  if(voice) u.voice = voice;
  let started = false;
  u.onstart = ()=>{ started = true; log('▶ 시작됨 (소리가 나야 정상)', 'ok'); };
  u.onend   = ()=>{ log('■ 끝남' + (started ? '' : ' — 시작 없이 끝남 = 소리 안 남'), started ? 'ok' : 'bad'); renderState(); };
  u.onerror = (e)=>{ log('✗ 오류: ' + (e.error || '알 수 없음'), 'bad'); renderState(); };
  log('말하기 요청: "' + text + '"' + (voice ? ' / ' + voice.name : ' / 기본 음성'));
  try{ ss.speak(u); }catch(e){ log('speak() 예외: ' + e.message, 'bad'); }
  setTimeout(()=>{ if(!started) log('3초 지나도 시작 안 됨 — 엔진이 멈춰 있음', 'bad'); renderState(); }, 3000);
}
document.getElementById('bDefault').onclick = ()=> speak('테스트입니다. 십초, 오초.');
document.getElementById('bPick').onclick = ()=>{
  const uri = document.getElementById('voiceSel').value;
  speak('테스트입니다. 십초, 오초.', voices().find(v=>v.voiceURI === uri));
};
document.getElementById('bReset').onclick = ()=>{
  try{ ss.cancel(); log('cancel() 호출'); }catch(e){}
  try{ ss.resume(); log('resume() 호출'); }catch(e){}
  setTimeout(()=>speak('초기화 후 테스트입니다.'), 300);
};
if(ss){ ss.onvoiceschanged = ()=>{ log('목소리 목록 바뀜'); renderState(); }; }
renderState();
setTimeout(renderState, 800);
log('페이지 열림 · ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /,'').slice(0,90));
</script>
</body>
</html>
