<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1.0">
<title>기구 아이콘 전체</title>
<style>
:root{--paper:#EFEAE1;--card:#FBF8F2;--paper-line:#D9D1BF;--ink:#1C2B39;--ink-soft:#5B6B74;--amber:#C98A2C;}
body{margin:0;background:var(--paper);font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);padding:10px;}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.c{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:4px;text-align:center;}
.c .n{font-size:8.5px;margin-top:1px;font-family:ui-monospace,monospace;color:var(--ink-soft);}
.ico{width:100%;display:block;color:var(--ink);--acc:var(--amber);}
.ico .fr{stroke:currentColor;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.ico .body{stroke:currentColor;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.ico .body circle{fill:currentColor;stroke:none;}
.ico .pad{fill:currentColor;}
.ico .mv{stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.ico .mv circle{fill:var(--acc);stroke:none;}
.ico .mv rect{fill:var(--acc);stroke:none;}
.ico .stack rect{fill:var(--acc);}
.ico .stack .sl{stroke:var(--card);stroke-width:1.6;fill:none;}
</style></head><body>
<p style="font-size:12.5px;color:#5B6B74;line-height:1.7;margin:0 0 10px;"><b>기구 아이콘 전체</b> — 종목이 아니라 기구 단위로 공용합니다. 카탈로그 99종이 이 43개로 덮입니다.</p><div class="g" id="g"></div>
<script>
/* ============================================================
   기구 아이콘 — 종목이 아니라 "기구" 단위로 공용한다.
   렛풀다운/와이드그립/클로즈그립은 기계가 같으니 그림도 같다.
   세부 차이는 종목마다 붙는 자세 안내 글이 담당한다.

   그리기 규칙
     fr    프레임 (먹색 선)        pad   시트·등판 (먹색 면)
     mv    잡거나 움직이는 것 (주황)  stack 중량추 (주황 블록 + 눈금)
     body  맨몸 운동의 몸 (굵은 먹색)
============================================================ */

  + `<path class="sl" d="${Array.from({length:n},(_,i)=>`M${x+1} ${y+6+i*6}H${x+15}`).join('')}"/></g>`;

  <path d="M34 46 h32 a8 8 0 0 1 8 8 v14 a16 16 0 0 1 -16 16 h-16 a16 16 0 0 1 -16 -16 v-14 a8 8 0 0 1 8 -8 z"/></g>`;

</script><script>
document.getElementById('g').innerHTML = Object.keys(EX_ICONS)

</script></body></html>
