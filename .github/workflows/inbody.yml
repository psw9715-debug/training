name: 인바디 동기화

# 서버 직접 로그인 방식은 한국 v3 서버가 비밀번호를 거부(PW_FAIL)해서 보류 중이다.
# 매일 실패 메일이 오지 않도록 자동 실행(schedule)은 꺼 두고, 손으로만 돌린다.
# 실제 동기화는 아이폰 단축어 → config/inbody/ 로 올리는 쪽을 쓴다 (docs/inbody-shortcut.md).
on:
  workflow_dispatch:            # Actions 탭에서 손으로만 돌린다
    inputs:
      mode:
        description: '동기화(sync) 또는 오류코드 확인(diag)'
        type: choice
        default: diag
        options: [sync, diag]

concurrency:
  group: inbody-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # git pull --rebase 를 하려면 전체 이력이 필요하다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 인바디에서 받아오기
        env:
          INBODY_LOGIN_ID: ${{ secrets.INBODY_LOGIN_ID }}
          INBODY_LOGIN_PW: ${{ secrets.INBODY_LOGIN_PW }}
          INBODY_COUNTRY_CODE: ${{ vars.INBODY_COUNTRY_CODE || 'KR' }}
          INBODY_MODE: ${{ inputs.mode }}
        run: python scripts/inbody_sync.py

      - name: 바뀌었으면 커밋
        run: |
          if [ -z "$(git status --porcelain config/inbody.json)" ]; then
            echo "새 측정 없음"
            exit 0
          fi
          git config user.name  "inbody-sync"
          git config user.email "actions@users.noreply.github.com"
          git add config/inbody.json
          git commit -m "inbody $(date -u -d '+9 hours' +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
